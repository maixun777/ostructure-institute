  <circle cx="60" cy="10" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="140" cy="25" r="1.4" fill="#99eeff" opacity="0.7"/>
  <circle cx="180" cy="60" r="1.3" fill="#ffffff" opacity="0.8"/>
  <circle cx="40" cy="150" r="1.3" fill="#aaddff" opacity="0.6"/>
